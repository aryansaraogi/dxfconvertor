[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2dxf"
version = "0.1.0"
description = "Convert PNG/JPEG images into laser-ready DXF contour outlines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
img2dxf = "img2dxf.cli:main"

[tool.setuptools.packages.find]
include = ["img2dxf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ezdxf 1.4 still sets .shape on arrays; nothing we can fix from here.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
